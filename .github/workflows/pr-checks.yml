name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run recording carries no identifiers
        run: |
          # The recording is built by allowlist in the app repo and checked
          # again by scripts/build_run.py. This is the third check, at the
          # point of no return: once this merges it is on a public website.
          # Deliberately independent of the Python so a bug in the builder
          # cannot also disable its own guard.
          shopt -s nullglob
          for f in recordings/*.json; do
            echo "checking $f"
            # Account ids, access key ids, emails. ARNs and IPs need the
            # context-aware check in build_run.py (AWS-managed policy ARNs and
            # private addresses are legitimate), which the build step runs.
            # -w anchors each match on word boundaries, so a 12-digit run
            # inside a longer number is not reported as an account id.
            if grep -owE '[0-9]{12}' "$f"; then
              echo "FAIL: $f contains what looks like an AWS account id"; exit 1
            fi
            if grep -owE '(AKIA|ASIA|AIDA|AROA|AIPA|ANPA|ANVA)[A-Z0-9]{12,}' "$f"; then
              echo "FAIL: $f contains an AWS key id"; exit 1
            fi
            if grep -oE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}' "$f"; then
              echo "FAIL: $f contains an email address"; exit 1
            fi
            echo "OK: $f"
          done

      - name: Build image
        run: docker build -t mayatrail-site:pr .

      - name: Blog sources stay out of the image
        run: |
          leaked=$(docker run --rm mayatrail-site:pr find /usr/share/nginx/html -name '*.md')
          [ -z "$leaked" ] || { echo "Markdown leaked into the image:"; echo "$leaked"; exit 1; }

      - name: JSX source stays out of the image
        run: |
          leaked=$(docker run --rm mayatrail-site:pr find /usr/share/nginx/html -name '*.jsx')
          [ -z "$leaked" ] || { echo "JSX leaked into the image:"; echo "$leaked"; exit 1; }

      - name: No internal files in the image
        run: |
          leaked=$(docker run --rm mayatrail-site:pr \
            find /usr/share/nginx/html \
              \( -name '*Pitch*' -o -name '*Market*' -o -name '*GTM*' \
                 -o -name '*Battlecards*' -o -name '*Demo Script*' \
                 -o -name '*deck-stage*' \
                 -o -path '*/internal/*' -o -path '*/logo/README.txt' \))
          [ -z "$leaked" ] || { echo "Internal files leaked into the image:"; echo "$leaked"; exit 1; }

      - name: Run container
        run: |
          docker run -d --name site-pr -p 8080:80 mayatrail-site:pr
          # wait for nginx to come up
          for i in $(seq 1 10); do
            curl -sf http://localhost:8080/health && break
            sleep 1
          done

      - name: Pages return 200 with content
        run: |
          check() {
            curl -sf "http://localhost:8080/$1" -o /tmp/body || { echo "FAIL (HTTP): $1"; exit 1; }
            if [ -n "$2" ]; then
              grep -qF -- "$2" /tmp/body || { echo "FAIL (content): $1 missing '$2'"; exit 1; }
            fi
            echo "OK: $1"
          }
          check "" "MayaTrail"
          check "index.html" "MayaTrail"
          check "run.html" "MayaTrail"
          check "scenarios.html" "MayaTrail"
          check "coverage.html" "MayaTrail"
          check "services.html" "MayaTrail"
          check "research.html" "MayaTrail"
          check "pricing.html" "MayaTrail"
          check "playbook.html" "MayaTrail"
          check "playbook.html" "id=\"containment\""
          check "blog/" "Field notes"
          check "blog/feed.xml" "<rss"
          check "mayatrail-base.css" "--cool"
          check "mayatrail-blog.css" ".prose"
          check "scripts/run-experience.js" ""
          check "vendor/react.production.min.js" ""
          check "vendor/react-dom.production.min.js" ""
          check "logo/mark-constellation.svg" ""
          check "logo/mark-triangle.svg" ""
          check "logo/mayatrail-lockup-constellation-dark.svg" ""
          check "logo/mayatrail-lockup-constellation-light.svg" ""
          check "logo/mayatrail-lockup-triangle-dark.svg" ""
          check "logo/mayatrail-lockup-triangle-light.svg" ""

      - name: Pages render without third-party JavaScript
        run: |
          # playbook.html used to compile its Markdown in the browser with
          # marked.js from jsdelivr, and run.html pulled React plus
          # Babel-standalone from unpkg to transpile JSX on every load. Both
          # are built ahead of time now. Guard against a CDN <script> creeping
          # back onto any page.
          for page in index.html coverage.html scenarios.html services.html \
                      pricing.html research.html playbook.html run.html; do
            body=$(curl -sf "http://localhost:8080/$page")
            if echo "$body" | grep -qE '<script[^>]+src="https?://'; then
              echo "FAIL: $page loads a third-party script"
              echo "$body" | grep -oE '<script[^>]+src="https?://[^"]*"'
              exit 1
            fi
            echo "OK (no external JS): $page"
          done

      - name: Link check
        run: |
          docker run --rm --network host lycheeverse/lychee:latest \
            --offline=false \
            --exclude 'github\.com|fonts\.|unpkg\.com|cdn-cgi|mailto:' \
            --accept 200,204,301,302 \
            --no-progress \
            http://localhost:8080/ \
            "http://localhost:8080/index.html" \
            "http://localhost:8080/run.html"

      - name: Container logs on failure
        if: failure()
        run: docker logs site-pr || true
